name: Security checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coretex-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            combined/package-lock.json

      - name: Scan the complete Git history for secrets
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --log-opts="--all" --config /repo/.gitleaks.toml --redact --no-banner --no-color

      - name: Audit monorepo locked dependencies
        run: npm audit --package-lock-only --audit-level=low

      - name: Audit standalone combined app locked dependencies
        working-directory: combined
        run: npm audit --package-lock-only --audit-level=low

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SESSION_SECRET: ci-only-session-secret-not-used-outside-tests-0001
      DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DATABASE_URL: postgresql://lifeos:lifeos@127.0.0.1:5432/lifeos?schema=public

    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: lifeos
          POSTGRES_PASSWORD: lifeos
          POSTGRES_DB: lifeos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifeos -d lifeos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            combined/package-lock.json

      - name: Install monorepo locked dependencies
        run: npm ci

      - name: Run security and release contract smokes
        run: |
          npm run smoke:browser-url -w coretex
          npm run smoke:security-privacy -w coretex
          npm run smoke:integration-secrets -w coretex
          npm run smoke:security-terminal -w coretex
          npm run smoke:bridge-auth -w coretex
          npm run smoke:bridge-client -w coretex
          npm run smoke:security -w apps/desktop
          npm run smoke:workouts-ui -w apps/desktop
          npm run smoke:update-contract -w apps/desktop
          npm run smoke:release

      - name: Build Brain, web, and desktop workspaces
        run: npm run build

      - name: Install standalone app locked dependencies
        working-directory: combined
        run: npm ci

      - name: Type-check and test standalone app
        working-directory: combined
        run: |
          npm run typecheck
          npm test

      - name: Build standalone app
        working-directory: combined
        run: npm run build

      - name: Deploy the standalone test schema
        working-directory: combined
        run: npm run db:deploy

      - name: Render every authenticated standalone route
        working-directory: combined
        run: |
          PORT=3200 npm run start > "$RUNNER_TEMP/coretex-standalone.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3200/api/version > /dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/coretex-standalone.log"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3200/api/version > /dev/null || {
            cat "$RUNNER_TEMP/coretex-standalone.log"
            exit 1
          }
          npm run smoke:routes -- http://127.0.0.1:3200
