name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coretex-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        id: codeql-analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:javascript-typescript"
          output: codeql-results
          # Personal private repositories cannot upload to GitHub Code Security
          # without a paid license. Keep analysis blocking while private, then
          # upload the same results automatically after publication.
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          upload-database: ${{ github.event.repository.private && 'false' || 'true' }}

      - name: Require zero CodeQL findings
        run: node scripts/assert-codeql-clean.mjs "${{ steps.codeql-analyze.outputs.sarif-output }}"
